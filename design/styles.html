<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RememberKey — 15 вариантов оформления</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;700;800&family=Russo+One&family=Exo+2:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&family=Montserrat:wght@400;500;600;700;800&family=Inter+Tight:wght@300;400;600;800&family=Unbounded:wght@400;600;700&family=Manrope:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&family=Lora:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Rubik:wght@500;700;900&family=Rubik+Mono+One&family=Oswald:wght@400;500;600;700&family=Sofia+Sans:wght@400;600;700;800&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=PT+Mono&family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!--
  15 вариантов оформления RememberKey. В каждом — одни и те же три экрана: главная, проверка по памяти, подсмотр.
  1 px = 1 dp, экран 412 × 915 (ROG Phone 9 Pro). Содержимое демонстрационное.
-->
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #0b0c0f; color: #e9ecf1; font: 15px/1.45 "Golos Text", system-ui, sans-serif; }
.top { position: sticky; top: 0; z-index: 20; background: #07080a; border-bottom: 1px solid #1d2026; padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.top h1 { margin: 0; font-size: 18px; }
.top .sp { flex: 1; }
.top label { font-size: 13px; color: #a9b0bc; display: flex; gap: 8px; align-items: center; cursor: pointer; }
.top select { background: #16181d; color: #e9ecf1; border: 1px solid #2a2e36; border-radius: 6px; padding: 4px 6px; font: 13px "Golos Text", sans-serif; }
.jump { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
.jump a { color: #c9ced8; text-decoration: none; font-size: 12.5px; background: #15171c; border: 1px solid #23262d; padding: 4px 9px; border-radius: 999px; }
.jump a:hover { border-color: #3fd09e; color: #fff; }
.intro { padding: 18px 20px 0; color: #a9b0bc; max-width: 980px; }
.intro b { color: #e9ecf1; font-weight: 600; }
main { padding: 8px 20px 60px; }
.var { padding: 26px 0 30px; border-bottom: 1px solid #1a1d23; }
.vh { display: flex; gap: 18px; align-items: flex-start; margin-bottom: 16px; max-width: 1100px; }
.vnum { font: 800 40px/1 "Golos Text", sans-serif; color: #2b3039; min-width: 58px; }
.vh h2 { margin: 0 0 4px; font-size: 22px; display: flex; gap: 10px; align-items: center; }
.vh h2 .tag { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: #1d2026; color: #a9b0bc; }
.vh h2 .tag.light { background: #f2ece0; color: #27231e; }
.vh p { margin: 0 0 8px; color: #b3b9c4; max-width: 760px; }
.meta { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; font-size: 12.5px; color: #8a919d; }
.sw { display: flex; gap: 4px; }
.sw i { width: 22px; height: 22px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
.phones { display: flex; gap: 26px; flex-wrap: wrap; align-items: flex-start; zoom: var(--z, .62); }
figure { margin: 0; display: flex; flex-direction: column; gap: 12px; align-items: center; }
figcaption { font-size: 22px; color: #8a919d; }
/* компактный режим: только главная */
body.compact main { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 0 18px; }
body.compact .var { border: 0; padding: 18px 0; }
body.compact .vh { flex-direction: column; gap: 4px; margin-bottom: 10px; }
body.compact .vh p, body.compact .meta, body.compact .vnum { display: none; }
body.compact .vh h2 { font-size: 16px; }
body.compact .vh h2::before { content: attr(data-n); color: #59606c; }
body.compact .phones figure:not(:first-child) { display: none; }
body.compact .phones { zoom: .62; }
body.compact figcaption { display: none; }
@keyframes blink { 50% { opacity: 0; } }

/* ============ телефон и общие части ============ */
.var {
  --bg: #14161a; --surface: #1c1f24; --surface2: #24282e; --surface3: #2f343b; --line: #2a2e35;
  --text: #f3f5f8; --text2: #b9bfc9; --text3: #7d8591;
  --acc: #3fd09e; --accText: #062419; --accSoft: #173a2f; --acc2: #6aa8ff; --acc2Soft: #1b2b44;
  --warn: #f2b33d; --warnSoft: #3a2f17; --warnText: #f5d9a3; --bad: #f06262;
  --radius: 18px; --btnRadius: 14px; --chipRadius: 12px; --avRadius: 14px; --trackRadius: 3px;
  --keyRadius: 7px; --keyBg: #2b3037; --keyFn: #3a4049; --kbBg: #0e1013; --keyText: #fff; --navBg: var(--surface);
  --font: "Golos Text", sans-serif; --fontHead: "Golos Text", sans-serif; --fontMono: "JetBrains Mono", monospace;
  --frame: #050506;
}
.phone { width: 412px; height: 915px; box-sizing: content-box; border: 10px solid var(--frame); border-radius: 38px; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); display: flex; flex-direction: column; position: relative; box-shadow: 0 12px 50px #000a, 0 0 0 1px #2a2a2e; }
.status { height: 30px; flex: none; display: flex; justify-content: space-between; align-items: center; padding: 0 22px; font: 500 13px var(--font); color: var(--text2); }
.status .si { display: flex; gap: 6px; align-items: center; }
.scr { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.gesture { height: 18px; flex: none; display: flex; justify-content: center; align-items: center; }
.gesture::after { content: ""; width: 108px; height: 4px; border-radius: 2px; background: var(--text2); opacity: .7; }
.appbar { height: 60px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 8px; }
.ib { width: 44px; height: 44px; display: grid; place-items: center; color: var(--text2); flex: none; }
.ttl { flex: 1; min-width: 0; font: 700 20px/1.2 var(--fontHead); padding-left: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ttl .sub { font: 400 13px var(--font); color: var(--text3); margin-top: 2px; letter-spacing: 0; text-transform: none; font-style: normal; text-shadow: none; }
.body { flex: 1; min-height: 0; overflow: hidden; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.body > * { flex-shrink: 0; }
.card { background: var(--surface); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.cap { font: 700 12px var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--warn); }
.big { font: 800 28px/1.15 var(--fontHead); }
.muted { color: var(--text2); font-size: 14px; }
.btn { height: 52px; border-radius: var(--btnRadius); background: var(--acc); color: var(--accText); font: 700 16px var(--font); display: flex; align-items: center; justify-content: center; gap: 8px; flex: none; }
.sect { font: 700 12px var(--font); color: var(--text3); text-transform: uppercase; letter-spacing: .08em; margin: 6px 4px -2px; }
.kc { background: var(--surface); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 12px; min-width: 0; }
.col { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.kav { width: 44px; height: 44px; border-radius: var(--avRadius); display: grid; place-items: center; font: 800 20px var(--fontHead); background: var(--accSoft); color: var(--acc); flex: none; }
.kav.b { background: var(--acc2Soft); color: var(--acc2); }
.kname { font: 700 17px var(--fontHead); }
.kmeta { font-size: 13px; color: var(--text3); }
.st { font: 700 12px var(--font); padding: 5px 10px; border-radius: var(--chipRadius); background: var(--surface2); color: var(--text2); white-space: nowrap; flex: none; }
.st.due { background: var(--warnSoft); color: var(--warn); }
.track { display: flex; gap: 4px; }
.track i { flex: 1; height: 6px; border-radius: var(--trackRadius); background: var(--surface3); }
.track i.d { background: var(--acc); }
.track i.n { background: var(--warn); }
.kfoot { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--text2); }
.copy { color: var(--acc); font-weight: 700; font-size: 12px; display: flex; gap: 4px; align-items: center; }
.add { height: 54px; border: 1.5px dashed var(--surface3); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--text2); font-weight: 700; }
.klist { background: var(--surface); border-radius: var(--radius); overflow: hidden; }
.kr { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); }
.kr:first-child { border-top: 0; }
.kr .kav { width: 40px; height: 40px; font-size: 17px; }
.kr .track { margin-top: 7px; }
.kr .track i { height: 4px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { background: var(--surface); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 8px; min-height: 160px; }
.tile .tt { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.tname { font: 700 18px var(--fontHead); margin-top: auto; }
.tile.addt { align-items: center; justify-content: center; color: var(--text2); border: 1.5px dashed var(--surface3); background: transparent; font-weight: 700; min-height: 110px; gap: 4px; }
.hero { position: relative; width: 200px; height: 200px; margin: 4px auto 0; }
.hero .hc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.hn { font: 800 58px/1 var(--fontHead); }
.hl { font-size: 13px; color: var(--text2); text-align: center; margin-top: 4px; }
.ring .bgc { fill: none; stroke: var(--surface3); stroke-width: 10; }
.ring .arc { fill: none; stroke: var(--acc); stroke-width: 10; stroke-linecap: round; }
.ring .ticks { display: none; stroke: var(--text3); stroke-width: 1.5; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats3 div { background: var(--surface); border-radius: calc(var(--radius) * .7); padding: 10px 6px; display: flex; flex-direction: column; align-items: center; }
.stats3 b { font: 800 20px var(--fontHead); }
.stats3 span { font-size: 11px; color: var(--text3); }
.nav { height: 70px; flex: none; display: flex; background: var(--navBg); border-top: 1px solid var(--line); }
.nav .it { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 500 12px var(--font); color: var(--text3); }
.nav .pill { width: 58px; height: 30px; border-radius: 15px; display: grid; place-items: center; }
.nav .it.on { color: var(--text); }
.nav .it.on .pill { background: var(--accSoft); color: var(--acc); }
.fab { display: none; position: absolute; right: 16px; bottom: 88px; height: 56px; padding: 0 20px 0 16px; border-radius: 16px; align-items: center; gap: 10px; font: 500 15px var(--font); }
.cmd, .hudline { display: none; }
/* проверка */
.prompt { font: 700 20px var(--fontHead); }
.hint { font-size: 14px; color: var(--text3); margin-top: 2px; }
.field { background: var(--surface2); border-radius: var(--radius); min-height: 100px; padding: 16px 52px 16px 16px; font: 500 21px/1.5 var(--fontMono); box-shadow: inset 0 0 0 1.5px var(--acc); position: relative; color: var(--text); letter-spacing: 1px; }
.field .eye { position: absolute; right: 12px; top: 12px; color: var(--text2); }
.caret { display: inline-block; width: 2px; height: 22px; background: var(--acc); vertical-align: -4px; margin-left: 2px; }
.typed { font-size: 13px; color: var(--text3); }
.pad { padding: 12px 16px 14px; flex: none; display: flex; flex-direction: column; gap: 8px; }
.kb { background: var(--kbBg); padding: 6px 3px 8px; display: flex; flex-direction: column; gap: 7px; flex: none; }
.kbcap { font-size: 11px; color: var(--text3); display: flex; gap: 5px; justify-content: center; align-items: center; height: 14px; }
.kb .r { display: flex; gap: 5px; justify-content: center; padding: 0 2px; }
.kb .k { flex: 1 1 0; min-width: 0; max-width: 38px; height: 46px; border-radius: var(--keyRadius); background: var(--keyBg); color: var(--keyText); display: grid; place-items: center; font: 400 19px var(--font); }
.kb .k.fn { flex: 1.5 1 0; max-width: none; background: var(--keyFn); font-size: 14px; font-weight: 700; }
.kb .k.sp { flex: 5 1 0; max-width: none; font-size: 13px; color: var(--text3); }
.kb .k.go { background: var(--acc); color: var(--accText); }
/* подсмотр */
.timer { font: 700 14px var(--fontMono); color: var(--warn); background: var(--warnSoft); padding: 6px 10px; border-radius: var(--chipRadius); }
.note { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; padding: 12px 14px; border-radius: var(--radius); background: var(--warnSoft); color: var(--warnText); }
.note svg { flex: none; }
.lh { display: flex; gap: 12px; align-items: flex-start; }
.lv { width: 26px; height: 26px; border-radius: 13px; background: var(--warnSoft); color: var(--warn); display: grid; place-items: center; font: 800 13px var(--font); flex: none; }
.lt { font: 700 16px var(--fontHead); }
.ld { font-size: 13px; color: var(--text3); }
.phrase { background: var(--surface2); border-radius: calc(var(--radius) * .7); padding: 12px 14px; font: 500 18px/1.7 var(--font); }
.phrase .bad { color: var(--bad); text-decoration: line-through; text-decoration-thickness: 2px; }
.phrase .op { color: var(--warn); }
.phrase .hid { color: var(--text3); letter-spacing: 2px; }
.hold { height: 46px; border-radius: var(--btnRadius); background: var(--warnSoft); color: var(--warn); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; }

/* ============ 2 · Игровой красный ============ */
.v2 { --bg: #0b0b0c; --surface: #161618; --surface2: #1f1f22; --surface3: #2b2b30; --line: #26262a; --text: #f4f4f5; --text2: #b4b4ba; --text3: #76767e;
  --acc: #ff2b2b; --accText: #fff; --accSoft: #3a0e0e; --acc2: #ff8a00; --acc2Soft: #3a2108; --warn: #ff8a00; --warnSoft: #33200a; --warnText: #ffc98a; --bad: #ff2b2b;
  --radius: 0px; --btnRadius: 0px; --chipRadius: 0; --avRadius: 0; --trackRadius: 0; --keyRadius: 2px; --keyBg: #1b1b1e; --keyFn: #2a2a2e; --kbBg: #000;
  --font: "Exo 2", sans-serif; --fontHead: "Russo One", sans-serif; }
.v2 .card, .v2 .tile, .v2 .field, .v2 .note { clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px)); }
.v2 .today { background: repeating-linear-gradient(135deg, rgba(255,43,43,.07) 0 10px, transparent 10px 22px), linear-gradient(110deg, #2a0909, #161618 60%); border-left: 4px solid var(--acc); }
.v2 .ttl, .v2 .big, .v2 .prompt, .v2 .lt, .v2 .tname, .v2 .hn { text-transform: uppercase; font-weight: 400; letter-spacing: .02em; }
.v2 .btn { clip-path: polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%); text-transform: uppercase; letter-spacing: .1em; font: 400 16px var(--fontHead); }
.v2 .kav { clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); background: var(--acc); color: #fff; font-weight: 400; }
.v2 .kav.b { background: var(--acc2); color: #1a0d00; }
.v2 .track i { transform: skewX(-25deg); height: 8px; }
.v2 .st.due { background: var(--acc); color: #fff; }
.v2 .tile.due { box-shadow: inset 0 -3px 0 var(--acc); }
.v2 .nav { border-top: 1px solid #2a0a0a; }
.v2 .nav .it.on .pill { background: transparent; color: var(--acc); box-shadow: inset 0 -3px 0 var(--acc); border-radius: 0; }
.v2 .field { box-shadow: inset 4px 0 0 var(--acc); }
.v2 .kb .k.go { clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
.v2 .lv { border-radius: 0; transform: skewX(-15deg); background: var(--acc); color: #fff; }
.v2 .sect { color: var(--acc); }
.v2 .hold { clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%); }

/* ============ 3 · Терминал ============ */
.v3 { --bg: #040704; --surface: transparent; --surface2: #0a140b; --surface3: #163019; --line: #1d4021; --text: #c6f8c2; --text2: #86d982; --text3: #4d8a4a;
  --acc: #3dff6e; --accText: #021003; --accSoft: #0d2a12; --acc2: #3dff6e; --acc2Soft: #0d2a12; --warn: #ffcf3d; --warnSoft: #2a230a; --warnText: #ffe08a; --bad: #ff5f5f;
  --radius: 0; --btnRadius: 0; --chipRadius: 0; --avRadius: 0; --trackRadius: 0; --keyRadius: 0; --keyBg: transparent; --keyFn: #0d2a12; --kbBg: #020402; --keyText: #86d982; --navBg: #040704;
  --font: "JetBrains Mono", monospace; --fontHead: "JetBrains Mono", monospace; }
.v3 .phone::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.25) 0 1px, transparent 1px 3px); }
.v3 .card, .v3 .klist { border: 1px dashed #2a6b30; }
.v3 .ttl { font-size: 17px; }
.v3 .ttl::before { content: "~/"; color: var(--text3); }
.v3 .cmd { display: block; color: var(--text3); font-size: 13px; }
.v3 .cmd b { color: var(--acc); font-weight: 500; }
.v3 .big { font-size: 24px; font-weight: 700; }
.v3 .btn { background: transparent; color: var(--acc); border: 1px solid var(--acc); text-transform: uppercase; font-weight: 500; }
.v3 .btn::before { content: "[ "; } .v3 .btn::after { content: " ]"; }
.v3 .kav { background: transparent; width: auto; display: flex; align-items: center; color: var(--acc); font-size: 16px; font-weight: 700; }
.v3 .kav::before { content: "["; } .v3 .kav::after { content: "]"; }
.v3 .kav.b { background: transparent; color: var(--acc); }
.v3 .track { gap: 3px; } .v3 .track i { height: 10px; background: #12301a; }
.v3 .track i.n { animation: blink 1s steps(1) infinite; }
.v3 .st { background: transparent; border: 1px solid currentColor; font-weight: 500; }
.v3 .st.due { background: var(--warn); color: #000; border-color: var(--warn); }
.v3 .nav { border-top: 1px dashed #2a6b30; }
.v3 .nav .pill { display: none; }
.v3 .nav .it { font-size: 13px; }
.v3 .nav .it.on .lb { background: var(--acc); color: #000; padding: 2px 6px; }
.v3 .nav .lb::before { content: "["; } .v3 .nav .lb::after { content: "]"; }
.v3 .field { box-shadow: none; border: 1px dashed var(--acc); background: transparent; }
.v3 .field::before { content: "> "; color: var(--acc); }
.v3 .caret { width: 11px; animation: blink 1s steps(1) infinite; }
.v3 .kb .k { border: 1px solid #1d4021; }
.v3 .kb .k.go { color: #000; }
.v3 .note { background: transparent; border: 1px dashed var(--warn); color: var(--warn); }
.v3 .lv { background: transparent; border: 1px solid var(--warn); border-radius: 0; }
.v3 .phrase { background: transparent; border-left: 2px solid var(--acc); border-radius: 0; font-family: var(--fontMono); font-size: 16px; }
.v3 .hold { background: transparent; border: 1px solid var(--warn); }
.v3 .add { border: 1px dashed #2a6b30; }
.v3 .sect::before { content: "# "; }
.v3 .timer { background: transparent; border: 1px solid var(--warn); }

/* ============ 4 · Сейф ============ */
.v4 { --bg: #111214; --surface: #1a1b1e; --surface2: #222428; --surface3: #2e3035; --line: #2c2a25; --text: #efe8d6; --text2: #c2b9a3; --text3: #857d6c;
  --acc: #c9a45c; --accText: #1b1406; --accSoft: #2e2616; --acc2: #9fb6c9; --acc2Soft: #1f2a33; --warn: #e3b45a; --warnSoft: #33280f; --warnText: #f0d7a1; --bad: #d9634e;
  --radius: 10px; --btnRadius: 6px; --chipRadius: 4px; --avRadius: 50%; --keyRadius: 6px; --keyBg: #202226; --keyFn: #2c2e33; --kbBg: #0c0d0e;
  --font: "IBM Plex Sans", sans-serif; --fontHead: "Cormorant Garamond", serif; --fontMono: "IBM Plex Mono", monospace; }
.v4 .phone { background: radial-gradient(120% 60% at 50% 0%, #1f2023, #111214 70%); }
.v4 .card, .v4 .klist, .v4 .stats3 div { border: 1px solid rgba(201,164,92,.22); box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 6px 18px rgba(0,0,0,.35); background: linear-gradient(180deg, #1d1e21, #17181b); }
.v4 .ttl { font-size: 28px; font-weight: 600; }
.v4 .prompt, .v4 .lt, .v4 .kname { font-weight: 700; }

  { n: 2, name: 'Игровой красный', home: 'tiles', fonts: 'Russo One, Exo 2', sw: ['#0b0b0c', '#161618', '#f4f4f5', '#ff2b2b', '#ff8a00', '#2b2b30'],

    ${lvl(1, 'Где ошибка', 'Красным — неверные слова в вашем вводе', '<div class="phrase">якорь сирень <span class="bad">трамвай</span> туман пряник витраж</div>')}
    ${lvl(2, 'Подсказать часть', 'Нажмите на скрытое слово', '<div class="phrase"><span class="hid">•••</span> <span class="hid">•••</span> <span class="op">олово</span> <span class="hid">•••</span> <span class="hid">•••</span> <span class="hid">•••</span></div>')}
    ${lvl(3, 'Показать целиком', 'Видно, пока держите кнопку', `<div class="hold">${ic(P.eye, 20)}Удерживайте, чтобы видеть</div>`)}
    </div><div class="pad"><div class="btn">Закрыть и ввести по памяти</div></div>`);
}

const LAYOUT = { cards: 'карточки', list: 'список', tiles: 'плитки', hero: 'кольцо прогресса' };
const main = document.getElementById('main');
main.innerHTML = V.map(v => `
  <section class="var v${v.n}" id="v${v.n}">
    <div class="vh"><div class="vnum">${String(v.n).padStart(2, '0')}</div><div>
      <h2 data-n="${v.n}. ">${v.name}<span class="tag ${v.light ? 'light' : ''}">${v.light ? 'светлая' : 'тёмная'}</span></h2>
      <p>${v.d}</p>
      <div class="meta"><span class="sw">${v.sw.map(c => `<i style="background:${c}" title="${c}"></i>`).join('')}</span><span>Шрифты: ${v.fonts}</span><span>Главная: ${LAYOUT[v.home]}</span></div>
    </div></div>
    <div class="phones">
      <figure>${home(v)}<figcaption>Главная</figcaption></figure>
      <figure>${check(v)}<figcaption>Проверка по памяти</figcaption></figure>
      <figure>${peek(v)}<figcaption>Подсмотр</figcaption></figure>
    </div>
  </section>`).join('');
document.getElementById('jump').innerHTML = V.map(v => `<a href="#v${v.n}">${v.n} · ${v.name}</a>`).join('');

const zoom = document.getElementById('zoom'), compact = document.getElementById('compact');
const applyZoom = () => document.querySelectorAll('.phones').forEach(el => el.style.setProperty('--z', zoom.value));
zoom.addEventListener('change', () => { applyZoom(); try { localStorage.setItem('rk-styles-zoom', zoom.value); } catch (e) {} });
compact.addEventListener('change', () => { document.body.classList.toggle('compact', compact.checked); try { localStorage.setItem('rk-styles-compact', compact.checked ? '1' : ''); } catch (e) {} });
try {
  const z = localStorage.getItem('rk-styles-zoom'); if (z) zoom.value = z;
  if (localStorage.getItem('rk-styles-compact')) { compact.checked = true; document.body.classList.add('compact'); }
} catch (e) {}
applyZoom();
</script>
</body>
</html>
